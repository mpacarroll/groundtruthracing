<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected</title><style>
:root{--bg:#fafaf8;--fg:#1a1a1a;--muted:#5c5c5c;--accent:#e34948}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--muted:#a3a3a3}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 16px}
h1{font-size:30px;line-height:1.2;margin:16px 0 8px}h2{font-size:20px;margin-top:32px}
p,li{color:var(--fg)}.muted{color:var(--muted)}a{color:var(--accent)}
img{width:96px;height:96px;border-radius:50%}
nav a{margin-right:16px}
code{word-break:break-all;background:rgba(127,127,127,.15);padding:2px 6px;border-radius:4px}
button{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
</style></head>
<body><main>
<nav><a href="../">Ground Truth Racing</a><a href="../privacy/">Privacy</a><a href="../terms/">Terms</a></nav>

<h1>Almost done</h1>
<p>Press Copy, then go back to the terminal and press Enter.</p>
<p><button id="copy">Copy</button> <span id="ok" class="muted"></span></p>
<p class="muted">This page only shows its own address so the setup tool can read it. Nothing is sent anywhere.</p>
<script>
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); document.getElementById("ok").textContent = "Copied."; }
  catch (e) { document.getElementById("ok").textContent = "Copy failed. Select the address bar and copy it."; }
};
</script>

</main></body></html>
